# Port backend
spring.application.name=backend_eykcorp

# Server
server.port=${SERVER_PORT:8081}
# Respeta los headers X-Forwarded-* del reverse proxy (Nginx), ej. para el header Location
server.forward-headers-strategy=framework

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/db_eykcorp}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}

# JPA
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

# Logging
logging.level.root=INFO
logging.level.com.michaeldev.backend_eykcorp=${APP_LOG_LEVEL:DEBUG}

# CORS (orígenes del frontend separados por coma)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
