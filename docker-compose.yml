services:

  # Base de datos PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: eykcorp_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-db_eykcorp}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-db_eykcorp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Microservicio Spring Boot
  backend:
    build: .
    image: eykcorp_backend
    container_name: eykcorp_backend
    environment:
      TZ: America/Guayaquil
      SERVER_PORT: ${SERVER_PORT:-8081}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-db_eykcorp}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
    ports:
      - "${SERVER_PORT:-8081}:${SERVER_PORT:-8081}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Frontend Vue servido por Nginx (reverse proxy /api -> backend)
  # Repositorio aparte: por defecto se espera en ../../Vue/frontend_eykcorp
  frontend:
    build: ${FRONTEND_PATH:-../../Vue/frontend_eykcorp}
    image: eykcorp_frontend
    container_name: eykcorp_frontend
    environment:
      BACKEND_URL: http://backend:${SERVER_PORT:-8081}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
